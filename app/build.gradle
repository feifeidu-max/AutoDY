plugins {
    id "com.android.application"
}

android {
    namespace "com.autody.blinkscroll"
    compileSdk 36

    defaultConfig {
        applicationId "com.autody.blinkscroll"
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName "1.3"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.mlkit:face-detection:16.1.7"
}
